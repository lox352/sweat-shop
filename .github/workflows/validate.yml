name: Validate pull requests

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      # A project knits the edition it was started on: none may read differently for a change to the code.
      - name: Every frozen edition reads as it did
        run: node scripts/readings.mjs --check
      - name: Build
        run: npm run build
      - name: Budgets
        run: npm run budgets
      - run: npx playwright install --with-deps chromium
      - name: Desktop and mobile knitting regression tests
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: test-results/
